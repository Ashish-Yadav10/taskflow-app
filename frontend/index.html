<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="sticky-header">
        <h1>TaskFlow Operations Dashboard</h1>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Add New Task</h2>
            <form id="add-task-form">
                <div class="form-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" placeholder="e.g. Review Dark Store Inventory">
                    <span id="title-error" class="error-msg"></span>
                </div>

                <div class="form-group">
                    <label for="task-priority">Priority</label>
                    <select id="task-priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="task-due">Due Date / Hint</label>
                    <input type="text" id="task-due" placeholder="e.g. tomorrow, next friday">
                </div>

                <button type="submit" id="submit-btn">Add Task</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Tasks List</h2>
            <div id="task-container" class="task-container"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
